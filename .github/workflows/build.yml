name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey via Scoop
        shell: pwsh
        run: |
          scoop install autohotkey@1.1.37.02 2>&1

      - name: Compile KMCounter.exe
        shell: pwsh
        run: |
          $ahk = (Get-ChildItem "$env:USERPROFILE\scoop\apps\autohotkey\*\AutoHotkeyU32.exe" | Select-Object -First 1).FullName
          $compiler = Join-Path (Split-Path $ahk) "Compiler\Ahk2Exe.exe"
          Write-Output "AHK: $ahk"
          Write-Output "Ahk2Exe: $compiler"
          & $compiler /in KMCounter.ahk /out KMCounter.exe /icon resouces/KMCounter.ico 2>&1
          Write-Output "Exit: $LASTEXITCODE"
          if (Test-Path "KMCounter.exe") { Write-Output "SUCCESS" }
          else { Write-Output "FAIL" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMCounter
          path: KMCounter.exe
