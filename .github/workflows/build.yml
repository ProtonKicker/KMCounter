name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AHK v1.1 + Ahk2Exe
        shell: pwsh
        run: |
          curl.exe -sL "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02_setup.exe" -o ahk_setup.exe
          7z x ahk_setup.exe -oahk | Out-Null
          Get-ChildItem ahk -Name | Select-String "AutoHotkey" | ForEach-Object { Write-Output $_ }

      - name: Compile KMCounter.exe
        shell: pwsh
        run: |
          .\ahk\Compiler\Ahk2Exe.exe /in KMCounter.ahk /out KMCounter.exe /base .\ahk\AutoHotkeyU32.exe /icon resouces/KMCounter.ico

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMCounter
          path: KMCounter.exe
