name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AHK v1.1 + Ahk2Exe
        shell: pwsh
        run: |
          curl.exe -sL "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02_setup.exe" -o ahk_setup.exe
          7z x ahk_setup.exe -oahk | Out-Null
          Get-ChildItem ahk -Recurse -File | Select-Object FullName

      - name: Compile KMCounter.exe
        shell: pwsh
        run: |
          $a2e = Resolve-Path "ahk/Compiler/Ahk2Exe.exe"
          $base = Resolve-Path "ahk/AutoHotkeyU32.exe"
          Write-Output "Ahk2Exe: $a2e"
          Write-Output "Base: $base"
          & $a2e /in KMCounter.ahk /out KMCounter.exe /base $base /icon resouces/KMCounter.ico
          if (Test-Path "KMCounter.exe") { Write-Output "SUCCESS: KMCounter.exe created" }
          else { Write-Output "FAIL: KMCounter.exe not found" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMCounter
          path: KMCounter.exe
