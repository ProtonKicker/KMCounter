name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AHK v1.1 + Ahk2Exe
        shell: pwsh
        run: |
          curl.exe -sL "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02_setup.exe" -o ahk_setup.exe
          7z x ahk_setup.exe -oahk | Out-Null

      - name: Compile KMCounter.exe
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          Push-Location "ahk\Compiler"
          & .\Ahk2Exe.exe /in "$root\KMCounter.ahk" /out "$root\KMCounter.exe" /icon "$root\resouces\KMCounter.ico" 2>&1
          Pop-Location
          Write-Output "Exit code: $LASTEXITCODE"
          if (Test-Path "$root\KMCounter.exe") { Write-Output "SUCCESS" }
          else { Write-Output "FAIL" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMCounter
          path: KMCounter.exe
