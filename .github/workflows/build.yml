name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with Ahk2Exe
        uses: cennis91/action-ahk2exe@main
        with:
          in: KMCounter.ahk
          out: KMCounter.exe
          icon: resouces/KMCounter.ico
          base: 'Unicode 32-bit.bin'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMCounter
          path: KMCounter.exe
