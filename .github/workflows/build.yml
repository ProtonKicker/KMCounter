name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey v1.1
        run: choco install autohotkey -y --no-progress

      - name: Compile KMCounter.exe
        run: |
          & "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe" `
            /in KMCounter.ahk `
            /out KMCounter.exe `
            /icon resouces/KMCounter.ico

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMCounter
          path: KMCounter.exe
