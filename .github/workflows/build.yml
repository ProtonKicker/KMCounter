name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AHK v1.1 + Ahk2Exe
        shell: pwsh
        run: |
          curl.exe -sL "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02_setup.exe" -o ahk_setup.exe
          7z x ahk_setup.exe -oahk | Out-Null
          Get-ChildItem ahk -Recurse -File | Select-Object FullName

      - name: Compile KMCounter.exe
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $a2e = Join-Path $root "ahk\Compiler\Ahk2Exe.exe"
          $base = Join-Path $root "ahk\AutoHotkeyU32.exe"
          $icon = Join-Path $root "resouces\KMCounter.ico"
          $in   = Join-Path $root "KMCounter.ahk"
          $out  = Join-Path $root "KMCounter.exe"
          & $a2e /in $in /out $out /base $base /icon $icon 2>&1
          Write-Output "Ahk2Exe exit code: $LASTEXITCODE"
          if (Test-Path $out) { Write-Output "SUCCESS" }
          else { Write-Output "FAIL" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMCounter
          path: KMCounter.exe
