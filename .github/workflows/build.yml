name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey v1.1
        shell: pwsh
        run: |
          curl.exe -sL "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02_setup.exe" -o installer.exe
          .\installer.exe /S

      - name: Compile KMCounter.exe
        shell: pwsh
        run: |
          & "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe" /in KMCounter.ahk /out KMCounter.exe /icon resouces/KMCounter.ico 2>&1
          Write-Output "Exit: $LASTEXITCODE"
          if (Test-Path "KMCounter.exe") { Write-Output "SUCCESS" }
          else { Write-Output "FAIL" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMCounter
          path: KMCounter.exe
