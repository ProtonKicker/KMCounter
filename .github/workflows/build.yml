name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AHK v1.1 + Ahk2Exe
        shell: pwsh
        run: |
          curl.exe -sL "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02_setup.exe" -o ahk_setup.exe
          7z x ahk_setup.exe -oahk | Out-Null

      - name: Test Ahk2Exe
        shell: pwsh
        run: |
          Write-Output "=== Check Ahk2Exe.exe exists ==="
          Test-Path "ahk\Compiler\Ahk2Exe.exe"
          Write-Output "=== Run Ahk2Exe with no args ==="
          & ".\ahk\Compiler\Ahk2Exe.exe" 2>&1
          Write-Output "=== Exit code: $LASTEXITCODE ==="
          Write-Output "=== Try compiling via AutoHotkey script ==="
          & ".\ahk\AutoHotkeyU32.exe" ".\ahk\Compiler\Ahk2Exe.ahk" /in "KMCounter.ahk" /out "KMCounter.exe" 2>&1
          Write-Output "=== AHK exit code: $LASTEXITCODE ==="
          Test-Path "KMCounter.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMCounter
          path: KMCounter.exe
