name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AutoHotkey v1.1 portable
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.autohotkey.com/download/1.1/AutoHotkey_1.1.37.02.zip" -OutFile ahk.zip
          7z x ahk.zip -oahk | Out-Null
          Get-ChildItem ahk\Compiler

      - name: Compile KMCounter.exe
        shell: pwsh
        run: |
          .\ahk\Compiler\Ahk2Exe.exe /in KMCounter.ahk /out KMCounter.exe /icon resouces/KMCounter.ico

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMCounter
          path: KMCounter.exe
